name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versionar caché y publicar en gh-pages
        run: |
          sed -i "s/const VERSION = '[^']*'/const VERSION = 'reproductor-${GITHUB_SHA::7}'/" sw.js
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-publicar
          git add -A
          git commit -m "Publicar ${GITHUB_SHA::7}"
          git push -f origin HEAD:gh-pages
